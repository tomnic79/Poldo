<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Poldo HD — Il banchetto dei colori</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="1280" height="720" aria-label="Poldo HD"></canvas>
      <div id="touch" aria-hidden="true">
        <div class="dpad">
          <button data-key="left"  aria-label="Sinistra">&#9664;</button>
          <button data-key="right" aria-label="Destra">&#9654;</button>
        </div>
        <div class="actions">
          <button data-key="down"  aria-label="Giù / Scendi">&#9660;</button>
          <button data-key="up"    aria-label="Su / Scala">&#9650;</button>
          <button data-key="jump" class="jump" aria-label="Salta">SALTA</button>
        </div>
      </div>
    </div>
    <p class="footer">
      Tributo amatoriale all'originale <em>Chubby Gristle</em> (Grandslam, 1988) &middot;
      Personaggio da main.jpg, vigile da vigile.gif, maggiolone da maggiolone.png, musica da theme.mp3
    </p>
  </div>
  <script src="main_frames.js"></script>
  <script src="scene_frames.js"></script>
  <script src="game.js"></script>
</body>
</html>
